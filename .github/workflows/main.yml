name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip app
        run: |
          ls
          unzip -o "$(ls *.zip | head -n 1)" -d src_unzipped
          ls src_unzipped

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        run: gradle -p src_unzipped assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: LagLab-debug-apk
          path: src_unzipped/app/build/outputs/apk/debug/app-debug.apk
